name: Deploy
on:
  push:
    branches: [master]
    paths:
      - '**.go'
      - 'assets/quote-backgrounds/*.png'
      - 'assets/sweet-backgrounds/*.jpg'
      - 'assets/birthday-backgrounds/*.png'
      - 'assets/birthdays.json'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - '**.go'
      - 'assets/quote-backgrounds/*.png'
      - 'assets/sweet-backgrounds/*.jpg'
      - 'assets/birthday-backgrounds/*.png'
      - 'assets/birthdays.json'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/deploy.yml'
permissions:
  contents: read
# Serialize deploys and cancel superseded pull request checks.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  Test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: testbot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        # Refresh the build cache if the test command or flags change.
        cache-dependency-path: |
          go.sum
          .github/workflows/deploy.yml
    - name: Install required media tools
      timeout-minutes: 15
      run: |
        sudo apt-get -o Acquire::Languages=none update
        sudo apt-get install -y --no-install-recommends ffmpeg imagemagick
        python3 -m venv "$RUNNER_TEMP/zavtra-media-tools"
        "$RUNNER_TEMP/zavtra-media-tools/bin/pip" install yt-dlp==2026.07.04
        echo "$RUNNER_TEMP/zavtra-media-tools/bin" >> "$GITHUB_PATH"
    - name: Verify media tools
      run: |
        ffmpeg -version
        ffprobe -version
        convert -version
        yt-dlp --version
    - name: Test
      env:
        ZAVTRA_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=test-only-password dbname=testbot sslmode=disable
        ZAVTRA_REQUIRE_MEDIA_TESTS: '1'
      run: |
        set -o pipefail
        go test -vet=all -race -count=1 -timeout 300s -coverprofile=coverage.out -json ./... | tee test-results.jsonl
    - name: Test summary and skipped tests
      if: always()
      run: |
        python3 - <<'PY'
        import json
        from pathlib import Path
        path = Path('test-results.jsonl')
        if not path.exists():
            raise SystemExit('Test results were not produced')
        events = [json.loads(line) for line in path.read_text().splitlines() if line.startswith('{')]
        top_level = [e for e in events if 'Test' in e and '/' not in e['Test']]
        finished = [e for e in top_level if e.get('Action') in ('pass', 'fail')]
        print('Slowest tests:')
        for test in sorted(finished, key=lambda e: e.get('Elapsed', 0), reverse=True)[:10]:
            print(f"  {test.get('Elapsed', 0):6.2f}s {test['Test']}")
        for action in ('pass', 'skip', 'fail'):
            tests = [e['Test'] for e in top_level if e.get('Action') == action]
            print(f'{action}: {len(tests)}')
            if action != 'pass':
                for test in tests:
                    print(f'  {test}')
        unexpected = [e['Test'] for e in events if e.get('Action') == 'skip' and e.get('Test') != 'TestMtprotoConnectProbe']
        if unexpected:
            raise SystemExit(f'Unexpected skipped tests: {unexpected}')
        PY
    - name: Coverage
      run: go tool cover -func=coverage.out | tail -1
    - name: Upload coverage
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage
        path: |
          coverage.out
          test-results.jsonl
  Deploy:
    # Only a merged change on master reaches the server: a pull request runs the
    # tests on GitHub's runner, never the sudo build/restart of the self-hosted one.
    needs: Test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Stage private chat channel catalog
      env:
        CHAT_CHANNELS_SEED: ${{ secrets.ZAVTRA_CHAT_CHANNELS_SEED }}
      run: |
        if [ -n "$CHAT_CHANNELS_SEED" ]; then
          umask 077
          seed_dir=$(mktemp -d /dev/shm/zavtrabot-catalog.XXXXXXXX)
          printf 'CHAT_CHANNELS_SEED_DIR=%s\n' "$seed_dir" >> "$GITHUB_ENV"
          printf '%s' "$CHAT_CHANNELS_SEED" > "$seed_dir/seed.json"
          bot_user=$(systemctl show --property=User --value telegram-go-chatbot)
          python3 - "$seed_dir" "${bot_user:-root}" <<'PY'
        import os
        import pwd
        import struct
        import sys
        from pathlib import Path

        seed_dir = Path(sys.argv[1])
        service_uid = pwd.getpwnam(sys.argv[2]).pw_uid
        undefined = 0xffffffff
        # Linux POSIX ACL v2. Only the runner and bot can access the seed.
        # The bot can traverse the directory and create the readiness file.
        for path, owner, service in ((seed_dir, 7, 3), (seed_dir / "seed.json", 6, 4)):
            entries = [
                (0x01, owner, undefined), (0x02, service, service_uid),
                (0x04, 0, undefined), (0x10, service, undefined), (0x20, 0, undefined),
            ]
            acl = struct.pack("<I", 2) + b"".join(struct.pack("<HHI", *entry) for entry in entries)
            os.setxattr(path, "system.posix_acl_access", acl)
        PY
          echo "Private chat channel catalog staged for the bot"
        fi
    - name: Build and install bot
      env:
        QUOTE_PROTECTED_AUTHORS: ${{ secrets.ZAVTRA_QUOTE_PROTECTED_USERNAMES }}
      run: |
        test -n "$QUOTE_PROTECTED_AUTHORS"
        ldflags="-X main.quoteProtectedDefaults=$QUOTE_PROTECTED_AUTHORS"
        if [ -n "${CHAT_CHANNELS_SEED_DIR:-}" ]; then
          ldflags="$ldflags -X main.deployedChatChannelSeedPath=$CHAT_CHANNELS_SEED_DIR/seed.json"
        fi
        go build -ldflags "$ldflags" -o telegram-go-chatbot
        sudo cp -fu telegram-go-chatbot /home/telegram/bot/
    - name: Restarting telegram-go-chatbot service
      run: |
        sudo systemctl restart telegram-go-chatbot
        if [ -n "${CHAT_CHANNELS_SEED_DIR:-}" ]; then
          for attempt in $(seq 1 30); do
            if [ -f "$CHAT_CHANNELS_SEED_DIR/seed.json.ready" ]; then
              break
            fi
            sleep 2
          done
          test -f "$CHAT_CHANNELS_SEED_DIR/seed.json.ready"
          echo "Bot initialized the private catalog and registered its command menus"
        else
          sleep 5
        fi
        systemctl is-active telegram-go-chatbot
    - name: Remove private catalog staging files
      if: always()
      run: |
        if [ -n "${CHAT_CHANNELS_SEED_DIR:-}" ]; then
          rm -f -- "$CHAT_CHANNELS_SEED_DIR/seed.json" "$CHAT_CHANNELS_SEED_DIR/seed.json.ready"
          rmdir -- "$CHAT_CHANNELS_SEED_DIR"
        fi
